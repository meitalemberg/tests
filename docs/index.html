<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מאגר בגרות ביוטכנולוגיה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css?v=9">
<script>
  // ערכת צבעים שנבחרה ידנית – לפני הציור, כדי שלא יהבהב
  try { const t = localStorage.getItem("bagrut-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#results">דילוג לשאלות</a>

<header class="top">
  <a href="#" class="brand" aria-label="מאגר בגרות ביוטכנולוגיה – לדף הבית">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M9 3c0 7 14 7 14 13S9 22 9 29"/><path d="M23 3c0 7-14 7-14 13s14 6 14 13"/>
        <path d="M11.5 8h9M11.5 24h9M13 12.5h6M13 19.5h6" stroke-width="1.8"/>
      </svg>
    </span>
    <span class="brand-text"><b>מאגר בגרות</b><small>מערכות ביוטכנולוגיות</small></span>
  </a>

  <form class="search" id="search-form" role="search" onsubmit="return false">
    <svg class="search-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="חיפוש בכל השאלות… למשל: PCR" aria-label="חיפוש שאלות" autocomplete="off">
  </form>

  <div class="top-actions">
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="מצב כהה / בהיר" title="מצב כהה / בהיר">
      <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button id="cart-toggle" class="cart-btn" type="button" aria-controls="cart">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3h8l3 3v15H5V3h3Z"/><path d="M9 10h6M9 14h6M9 18h4"/></svg>
      <span class="cart-btn-label">המבחן שלי</span>
      <span id="cart-count" class="count">0</span>
    </button>
  </div>
</header>

<div class="layout">
  <nav class="topics" id="topics" aria-label="נושאים"></nav>

  <main class="results" id="main">
    <div class="results-head" id="results-head">
      <nav id="crumbs" class="crumbs" aria-label="מיקום"></nav>
      <div class="title-row">
        <h1 id="results-title"></h1>
        <button type="button" id="topics-toggle" class="ghost-btn topics-toggle" aria-controls="topics" aria-expanded="false">כל הנושאים ▾</button>
      </div>
      <p id="results-sub" class="mute"></p>
      <div id="filters" class="filters" role="group" aria-label="סינון">
        <div class="seg" id="f-type" role="radiogroup" aria-label="סוג שאלה">
          <button type="button" data-type="" role="radio">הכול</button>
          <button type="button" data-type="open" role="radio">פתוחות</button>
          <button type="button" data-type="mc" role="radio">אמריקאיות</button>
          <button type="button" data-type="tf" role="radio">נכון / לא נכון</button>
        </div>
        <label class="select"><span class="sr">שנה</span>
          <select id="f-year"><option value="">כל השנים</option></select>
        </label>
        <label class="switch"><input type="checkbox" id="opt-online"><span class="track"></span> הסתרת שאלות עם כלים מקוונים</label>
        <label class="switch"><input type="checkbox" id="opt-source" checked><span class="track"></span> הפניה לבגרות</label>
        <button type="button" id="f-clear" class="link-btn" hidden>ניקוי סינון</button>
      </div>
    </div>
    <div id="results"></div>
  </main>
</div>

<div class="cartbar" id="cartbar" hidden>
  <div class="cartbar-in">
    <span id="cartbar-text"></span>
    <button type="button" id="cartbar-open" class="btn">לצפייה ועריכה</button>
  </div>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<aside class="cart" id="cart" aria-label="המבחן שלי" aria-hidden="true">
  <div class="cart-head">
    <div>
      <h2>המבחן שלי</h2>
      <div id="cart-total" class="cart-total"></div>
    </div>
    <button id="cart-close" class="icon-btn" type="button" aria-label="סגירה">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="cart-body">
    <div id="cart-empty" class="cart-empty">
      <div class="empty-ico" aria-hidden="true">📝</div>
      <b>המבחן עדיין ריק</b>
      <p>לחצו על <span class="kbd">+ הוספה למבחן</span> ליד שאלה. אפשר לבחור סעיפים, לשנות ניקוד ולסדר מחדש.</p>
    </div>
    <ol id="cart-list" class="cart-list"></ol>
    <details class="exam-details" id="exam-details">
      <summary>פרטי הכותרת בקובץ הוורד</summary>
      <form id="header-form" class="header-form" autocomplete="off">
        <label>שם בית הספר <input name="school"></label>
        <label>שם המבחן <input name="exam"></label>
        <div class="two">
          <label>כיתה <input name="cls"></label>
          <label>תאריך <input name="date"></label>
        </div>
        <label>משך <input name="duration" placeholder="למשל: שעתיים"></label>
        <label>הוראות <textarea name="instructions" rows="3"></textarea></label>
        <p class="mute small">שדה ריק לא יודפס.</p>
      </form>
    </details>
    <div id="convert" class="convert"></div>
  </div>
  <div class="cart-foot">
    <div class="cart-actions">
      <button type="button" id="export-a" class="btn primary" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
        ייצוא לוורד</button>
      <button type="button" id="export-b" class="btn" disabled title="השאלות והאפשרויות בסדר מעורבב">טור ב׳</button>
    </div>
    <div class="cart-foot-row">
      <p id="export-status" class="mute small" role="status"></p>
      <button type="button" id="cart-clear" class="link-btn danger" hidden>ריקון המבחן</button>
    </div>
  </div>
</aside>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<button type="button" class="to-top" id="to-top" aria-label="חזרה לראש העמוד" hidden>
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script src="vendor/docx-9.5.1.umd.js"></script>
<script src="data.js?v=13"></script>
<script src="app.js?v=11"></script>
<script src="export.js?v=10"></script>
</body>
</html>
